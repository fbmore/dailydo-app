<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DailyDo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/dailydo.png">
<link rel="apple-touch-icon" href="/dailydo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas:#FBF8F3; --surface:#FFFFFF; --ink:#1F1B16; --muted:#7A7168;
    --line:rgba(31,27,22,.09); --soft:rgba(31,27,22,.05);
    --acc:#9466BF; --acc-soft:rgba(148,102,191,.14);
    --card-shadow:0 0 0 1px rgba(31,27,22,.06), 0 1px 2px rgba(31,27,22,.04), 0 8px 24px rgba(31,27,22,.05);
    --img-outline:oklch(0 0 0 / .1);
    --display:"Bricolage Grotesque",ui-serif,Georgia,serif;
    --body:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
    --ease:cubic-bezier(.2,0,0,1);
    color-scheme:light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas:#141217; --surface:#1E1B22; --ink:#F2EFEA; --muted:#9B939F;
      --line:rgba(242,239,234,.10); --soft:rgba(242,239,234,.06);
      --acc:#B48BDB; --acc-soft:rgba(180,139,219,.16);
      --card-shadow:0 0 0 1px rgba(242,239,234,.07), 0 8px 24px rgba(0,0,0,.35);
      --img-outline:oklch(1 0 0 / .1);
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--canvas); color:var(--ink);
    font-family:var(--body); font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  }
  a { color:var(--acc); }
  button { font:inherit; color:inherit; }
  .wrap { max-width:1120px; margin:0 auto; padding:0 16px; }
  @media (min-width:700px) { .wrap { padding:0 32px; } }
  .narrow { max-width:680px; margin-left:auto; margin-right:auto; }

  /* top bar */
  .bar { position:sticky; top:0; z-index:20; backdrop-filter:saturate(1.6) blur(16px); -webkit-backdrop-filter:saturate(1.6) blur(16px);
         background:color-mix(in oklab, var(--canvas) 82%, transparent); border-bottom:1px solid var(--line); }
  .bar .wrap { display:flex; align-items:center; justify-content:space-between; height:56px; gap:12px; }
  .brand { display:flex; align-items:center; gap:9px; font-family:var(--display); font-weight:600; font-size:16px; color:var(--ink); text-decoration:none; }
  .brand img { width:26px; height:26px; border-radius:7px; outline:1px solid var(--img-outline); outline-offset:-1px; }
  .actions { display:flex; gap:8px; }
  .btn { display:inline-flex; align-items:center; gap:7px; height:40px; padding:0 14px; border:0; border-radius:12px; cursor:pointer;
         background:var(--surface); box-shadow:var(--card-shadow); font-size:14px; font-weight:500; text-decoration:none; color:var(--ink);
         transition-property:scale, background-color; transition-duration:.15s; transition-timing-function:var(--ease); white-space:nowrap; }
  .btn:active { scale:.96; }
  .btn.primary { background:var(--acc); color:#fff; box-shadow:none; }
  .btn svg { width:17px; height:17px; flex:none; }
  .btn .lbl-short { display:none; }
  @media (max-width:520px) { .btn .lbl { display:none; } .btn { padding:0 11px; } .btn.has-short .lbl-short { display:inline; } }

  /* header */
  header.hero { padding:44px 0 8px; text-align:center; }
  .from { display:inline-flex; align-items:center; gap:10px; font-size:14px; color:var(--muted); }
  .avatar { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:var(--acc-soft); color:var(--acc); font-weight:600; font-size:14px; }
  h1 { font-family:var(--display); font-weight:600; font-size:clamp(32px,6vw,52px); line-height:1.08; letter-spacing:-.02em; margin:14px auto 0; max-width:820px; text-wrap:balance; }
  .message { position:relative; display:inline-block; margin:20px auto 0; max-width:560px; padding:12px 18px; border-radius:18px 18px 18px 6px;
             background:var(--surface); box-shadow:var(--card-shadow); font-size:16px; text-align:left; text-wrap:pretty; }
  .meta { margin-top:16px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }

  /* contents chips */
  .toc { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:24px auto 0; }
  .toc a { display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 12px; border-radius:999px; background:var(--soft); color:var(--ink);
           text-decoration:none; font-size:13px; font-weight:500; transition:background-color .15s var(--ease); }
  .toc a:hover { background:var(--line); }
  .toc svg { flex:none; width:14px; height:14px; color:var(--muted); }
  .toc a { max-width:100%; } .toc a span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* item sections */
  main { padding:24px 0 24px; }
  section.item { margin:40px 0 0; scroll-margin-top:72px; }
  section.item + section.item { padding-top:40px; border-top:1px solid var(--line); }
  .kind { display:flex; align-items:center; gap:7px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; font-weight:600; color:var(--muted); }
  .kind svg { width:15px; height:15px; }
  h2.item-title { font-family:var(--display); font-weight:600; font-size:clamp(24px,4vw,32px); line-height:1.15; letter-spacing:-.01em; margin:8px 0 0; text-wrap:balance; }
  .single h2.item-title { display:none; }
  .single .kind { justify-content:center; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .chip { display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 10px; border-radius:999px; background:var(--soft); font-size:12.5px; font-weight:500; font-variant-numeric:tabular-nums; }
  .chip i { width:8px; height:8px; border-radius:50%; }
  .block { margin-top:20px; }

  /* markdown */
  .md { font-size:17px; line-height:1.7; text-wrap:pretty; }
  .md > :first-child { margin-top:0; } .md > :last-child { margin-bottom:0; }
  .md h1, .md h2, .md h3 { font-family:var(--display); font-weight:600; line-height:1.2; margin:1.6em 0 .5em; text-wrap:balance; }
  .md h1 { font-size:26px; } .md h2 { font-size:22px; } .md h3 { font-size:18px; }
  .md blockquote { margin:1.2em 0; padding:2px 0 2px 18px; border-left:3px solid var(--acc); color:var(--muted); font-style:italic; }
  .md code { font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--soft); padding:2px 5px; border-radius:6px; }
  .md pre { background:var(--soft); padding:14px 16px; border-radius:12px; overflow:auto; }
  .md pre code { background:none; padding:0; }
  .md img { max-width:100%; border-radius:12px; outline:1px solid var(--img-outline); outline-offset:-1px; }
  .md ul, .md ol { padding-left:1.3em; } .md li { margin:.25em 0; }
  .md ul.tasklist { list-style:none; padding-left:0; }
  .md li.task-li { display:flex; align-items:flex-start; gap:12px; margin:.45em 0; }
  .md li.task-li .box { margin-top:4px; }
  .md li.task-li.done { color:var(--muted); text-decoration:line-through; text-decoration-color:color-mix(in oklab, var(--muted) 60%, transparent); }
  .md li.task-li > ul { flex-basis:100%; }
  .md hr { border:0; border-top:1px solid var(--line); margin:2em 0; }
  .md table { border-collapse:collapse; width:100%; display:block; overflow-x:auto; font-size:15px; }
  .md th, .md td { border-bottom:1px solid var(--line); padding:8px 10px; text-align:left; }

  /* checklist */
  .card { background:var(--surface); border-radius:20px; box-shadow:var(--card-shadow); }
  .checklist { list-style:none; margin:0; padding:6px; }
  .checklist li { display:flex; align-items:flex-start; gap:12px; padding:10px 12px; border-radius:14px; font-size:16px; }
  .checklist li + li { border-top:1px solid var(--line); border-radius:0; }
  .box { flex:none; width:22px; height:22px; margin-top:1px; border-radius:7px; box-shadow:inset 0 0 0 1.5px var(--muted); display:grid; place-items:center; }
  .done .box { background:var(--acc); box-shadow:none; color:#fff; }
  .done .box svg, .box svg { width:14px; height:14px; stroke-width:2.6; }
  .done span.t { color:var(--muted); text-decoration:line-through; text-decoration-color:color-mix(in oklab, var(--muted) 60%, transparent); }
  .progress { display:flex; align-items:center; gap:10px; padding:14px 18px 4px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .progress .track { flex:1; height:6px; border-radius:3px; background:var(--soft); overflow:hidden; }
  .progress .fill { height:100%; background:var(--acc); border-radius:3px; }

  /* link card */
  a.linkcard { display:flex; flex-direction:column; overflow:hidden; text-decoration:none; color:var(--ink); transition:scale .15s var(--ease); }
  a.linkcard:active { scale:.99; }
  a.linkcard img { width:100%; aspect-ratio:1.91/1; object-fit:cover; display:block; }
  a.linkcard .lc { padding:14px 18px 16px; display:flex; align-items:center; gap:14px; }
  a.linkcard .lc div { flex:1; min-width:0; }
  a.linkcard .site { font-size:13px; color:var(--muted); }
  a.linkcard .lt { font-weight:600; font-size:16px; line-height:1.35; text-wrap:pretty; }
  a.linkcard .go { flex:none; width:36px; height:36px; border-radius:50%; background:var(--acc-soft); color:var(--acc); display:grid; place-items:center; }
  a.linkcard .go svg { width:16px; height:16px; }
  @media (min-width:700px) { a.linkcard.has-img { flex-direction:row; } a.linkcard.has-img img { width:44%; aspect-ratio:auto; min-height:180px; } a.linkcard .lc { padding:20px 22px; } }

  /* galleries */
  .gallery { display:grid; gap:8px; }
  .gallery.n1 .tile img, .gallery.n1 .tile video { max-height:78vh; width:auto; max-width:100%; margin:0 auto; }
  .gallery.n1 .tile { background:none; display:flex; justify-content:center; }
  .gallery.n2 { grid-template-columns:1fr 1fr; }
  /* justified rows: each tile grows in proportion to its aspect ratio, so a row shares one height */
  .gallery.many { display:flex; flex-wrap:wrap; gap:6px; --row:150px; }
  @media (min-width:700px) { .gallery.many { --row:230px; gap:8px; } }
  .gallery.many::after { content:""; flex-grow:999; }
  .gallery.many .tile { width:auto; flex:var(--r) 1 calc(var(--r) * var(--row)); aspect-ratio:var(--r); }
  .gallery.many .tile img, .gallery.many .tile video { width:100%; height:100%; object-fit:cover; }
  .tile { position:relative; display:block; width:100%; padding:0; border:0; border-radius:14px; overflow:hidden; cursor:zoom-in; background:var(--soft); }
  .tile img, .tile video { display:block; width:100%; height:auto; border-radius:14px; }
  .tile::after { content:""; position:absolute; inset:0; border-radius:14px; outline:1px solid var(--img-outline); outline-offset:-1px; pointer-events:none; }
  .gallery.n2 .tile img { height:100%; object-fit:cover; }
  .tile img { transition:scale .4s var(--ease); }
  @media (hover:hover) { .tile:hover img { scale:1.015; } }
  .tile .play { position:absolute; inset:0; display:grid; place-items:center; }
  .tile .play span { width:56px; height:56px; border-radius:50%; background:rgba(0,0,0,.45); backdrop-filter:blur(8px); display:grid; place-items:center; color:#fff; }
  .tile .play svg { width:22px; height:22px; margin-left:3px; }
  .gallery-tools { display:flex; justify-content:flex-end; gap:8px; margin-bottom:10px; }

  /* documents */
  .doc { display:flex; gap:18px; align-items:center; padding:14px; }
  .doc .cover { flex:none; width:96px; aspect-ratio:8.5/11; border-radius:8px; background:var(--soft); overflow:hidden; position:relative; cursor:pointer; border:0; padding:0; }
  .doc .cover canvas { width:100%; height:100%; display:block; }
  .doc .cover::after { content:""; position:absolute; inset:0; border-radius:8px; outline:1px solid var(--img-outline); outline-offset:-1px; }
  .doc .info { flex:1; min-width:0; }
  .doc .name { font-weight:600; overflow-wrap:anywhere; }
  .doc .sub { font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .doc .row { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .file { display:flex; align-items:center; gap:14px; padding:12px 14px; }
  .file + .file { border-top:1px solid var(--line); }
  .file .ext { flex:none; width:40px; height:48px; border-radius:8px; background:var(--acc-soft); color:var(--acc); display:grid; place-items:center; font-size:11px; font-weight:700; text-transform:uppercase; }
  .file .info { flex:1; min-width:0; }

  /* audio */
  .audio { padding:16px; }
  .player { display:flex; align-items:center; gap:14px; }
  .pp { flex:none; width:48px; height:48px; border-radius:50%; border:0; background:var(--acc); color:#fff; display:grid; place-items:center; cursor:pointer; transition:scale .15s var(--ease); }
  .pp:active { scale:.96; }
  .pp svg { width:20px; height:20px; }
  .pp .i-play { margin-left:3px; }
  .scrub { flex:1; min-width:0; }
  .scrub .an { font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .scrub input { width:100%; accent-color:var(--acc); margin:6px 0 0; }
  .scrub .tm { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .transcript { margin:14px 2px 2px; padding-top:14px; border-top:1px solid var(--line); font-size:16px; line-height:1.7; text-wrap:pretty; }
  .transcript .lab { display:block; font-size:12px; letter-spacing:.12em; text-transform:uppercase; font-weight:600; color:var(--muted); margin-bottom:6px; }

  /* footer */
  footer { padding:56px 0 calc(40px + env(safe-area-inset-bottom)); text-align:center; color:var(--muted); font-size:13px; }
  .made { display:inline-flex; flex-direction:column; align-items:center; gap:12px; padding:22px 26px; border-radius:24px; background:var(--surface); box-shadow:var(--card-shadow); }
  .made .t { font-family:var(--display); font-size:17px; font-weight:600; color:var(--ink); }
  .made img.badge { height:40px; }
  footer p { margin:18px auto 0; max-width:520px; text-wrap:pretty; }
  footer a { color:var(--muted); }

  /* states */
  .state { min-height:70vh; display:grid; place-items:center; text-align:center; padding:40px 16px; }
  .state h1 { font-size:clamp(26px,5vw,36px); }
  .state p { color:var(--muted); max-width:420px; margin:12px auto 24px; text-wrap:pretty; }
  .skeleton { height:18px; border-radius:9px; background:var(--soft); margin:12px auto; animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.5; } }

  /* entrance (once, on first render) */
  .enter { opacity:0; translate:0 8px; animation:rise .5s var(--ease) forwards; }
  @keyframes rise { to { opacity:1; translate:0 0; } }
  @media (prefers-reduced-motion: reduce) { .enter { animation:none; opacity:1; translate:none; } .skeleton { animation:none; } }

  /* lightbox */
  .lb { position:fixed; inset:0; z-index:100; background:#0B0A0D; color:#fff; display:flex; flex-direction:column; opacity:0; pointer-events:none; transition:opacity .2s var(--ease); }
  .lb.open { opacity:1; pointer-events:auto; }
  .lb-top { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:calc(8px + env(safe-area-inset-top)) 12px 8px; }
  .lb-count { font-size:14px; color:rgba(255,255,255,.7); font-variant-numeric:tabular-nums; padding-left:6px; }
  .lb-tools { display:flex; gap:4px; align-items:center; }
  .ib { position:relative; width:44px; height:44px; border:0; border-radius:12px; background:transparent; color:#fff; display:grid; place-items:center; cursor:pointer;
        transition-property:background-color, scale; transition-duration:.15s; transition-timing-function:var(--ease); }
  .ib:hover { background:rgba(255,255,255,.1); } .ib:active { scale:.96; }
  .ib svg { width:20px; height:20px; }
  .ib .a, .ib .b { position:absolute; transition-property:opacity, scale, filter; transition-duration:.2s; transition-timing-function:var(--ease); }
  .ib .b { opacity:0; scale:.25; filter:blur(4px); }
  .ib.on .a { opacity:0; scale:.25; filter:blur(4px); } .ib.on .b { opacity:1; scale:1; filter:blur(0); }
  .speed { height:32px; border-radius:9px; border:0; background:rgba(255,255,255,.1); color:#fff; padding:0 8px; font-size:13px; font-variant-numeric:tabular-nums; }
  .lb-stage { position:relative; flex:1; min-height:0; display:grid; place-items:center; touch-action:pan-y; }
  .lb-stage > img, .lb-stage > video { position:absolute; inset:0; margin:auto; max-width:100%; max-height:100%; object-fit:contain; transition:opacity .35s var(--ease); }
  .lb-nav { position:absolute; top:50%; translate:0 -50%; width:48px; height:48px; border-radius:50%; border:0; background:rgba(255,255,255,.12); backdrop-filter:blur(10px); color:#fff; display:grid; place-items:center; cursor:pointer; transition:background-color .15s var(--ease); }
  .lb-nav:hover { background:rgba(255,255,255,.22); }
  .lb-nav svg { width:20px; height:20px; }
  .lb-prev { left:16px; } .lb-next { right:16px; }
  @media (hover:none) { .lb-nav { display:none; } }
  .lb-cap { text-align:center; font-size:13px; color:rgba(255,255,255,.65); padding:10px 16px calc(14px + env(safe-area-inset-bottom)); min-height:44px; }

  /* pdf reader */
  .reader { position:fixed; inset:0; z-index:100; background:color-mix(in oklab, var(--canvas) 70%, #000 0%); display:flex; flex-direction:column; opacity:0; pointer-events:none; transition:opacity .2s var(--ease); }
  .reader.open { opacity:1; pointer-events:auto; }
  .reader .lb-top { color:var(--ink); background:var(--canvas); border-bottom:1px solid var(--line); }
  .reader .lb-count { color:var(--muted); }
  .reader .ib { color:var(--ink); } .reader .ib:hover { background:var(--soft); }
  .pages { flex:1; overflow:auto; padding:20px 16px 40px; display:flex; flex-direction:column; align-items:center; gap:16px; }
  .pages canvas { width:min(100%, 820px); height:auto; background:#fff; border-radius:6px; box-shadow:var(--card-shadow); }
  .toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); translate:-50% 12px; z-index:200; background:var(--ink); color:var(--canvas); padding:10px 16px; border-radius:12px; font-size:14px; font-weight:500; opacity:0; pointer-events:none; transition-property:opacity, translate; transition-duration:.2s; transition-timing-function:var(--ease); }
  .toast.show { opacity:1; translate:-50% 0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="bar"><div class="wrap">
  <a class="brand" href="/"><img src="/dailydo.png" alt="">DailyDo</a>
  <div class="actions" id="topActions" hidden>
    <button class="btn" id="dlAll" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg><span class="lbl">Download all</span></button>
    <button class="btn primary has-short" id="copyLink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg><span class="lbl">Copy link</span><span class="lbl-short">Copy</span></button>
  </div>
</div></div>

<div id="app">
  <div class="state"><div style="width:min(420px,80vw)"><div class="skeleton" style="width:40%"></div><div class="skeleton" style="height:36px;width:80%"></div><div class="skeleton" style="width:60%"></div></div></div>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
  <div class="lb-top">
    <div class="lb-count" id="lbCount"></div>
    <div class="lb-tools">
      <select class="speed" id="lbSpeed" aria-label="Slideshow speed"><option value="3">3 s</option><option value="5" selected>5 s</option><option value="10">10 s</option></select>
      <button class="ib" id="lbPlay" aria-label="Play slideshow"><svg class="a" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg><svg class="b" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg></button>
      <button class="ib" id="lbFull" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="ib" id="lbSave" aria-label="Download"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg></button>
      <button class="ib" id="lbClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </div>

    else if (e.key === "ArrowLeft") { stopShow(); lbShow(lbIdx - 1, false); }
    else if (e.key === " ") { e.preventDefault(); lbTimer ? stopShow() : startShow(); }
  });

  // ---- pdf reader ----
  function openReader(a) {
    var r = $("#reader"), pages = $("#rdPages");
    $("#rdTitle").textContent = a.name; $("#rdSave").href = dl(a); $("#rdSave").setAttribute("download", a.name);
    pages.innerHTML = ""; r.classList.add("open"); r.setAttribute("aria-hidden", "false"); document.body.style.overflow = "hidden"; $("#rdClose").focus();
    if (!window.pdfjsLib) { window.open(a.url, "_blank", "noopener"); closeReader(); return; }
    pdfjsLib.getDocument(a.url).promise.then(function (pdf) {
      var dpr = Math.min(window.devicePixelRatio || 1, 2), width = Math.min(pages.clientWidth - 32, 820);
      var chain = Promise.resolve();
      for (var n = 1; n <= pdf.numPages; n++) (function (n) {
        chain = chain.then(function () { return pdf.getPage(n); }).then(function (p) {
          var vp = p.getViewport({ scale: 1 }), v = p.getViewport({ scale: width / vp.width * dpr });
          var c = el("canvas", { width: Math.round(v.width), height: Math.round(v.height), "aria-label": "Page " + n });
          pages.appendChild(c);
          return p.render({ canvasContext: c.getContext("2d"), viewport: v }).promise;
        });
      })(n);
    }).catch(function () { pages.appendChild(el("p", { text: "This document couldn't be shown here. Use Download instead." })); });
  }
  function closeReader() { var r = $("#reader"); r.classList.remove("open"); r.setAttribute("aria-hidden", "true"); document.body.style.overflow = ""; }
  $("#rdClose").onclick = closeReader;

  // ---- downloads ----
  function dl(m) { return m.download || m.url; }
  function fetchBytes(u) { return fetch(u).then(function (r) { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).then(function (b) { return new Uint8Array(b); }); }
  function saveBlob(blob, name) { var u = URL.createObjectURL(blob); var a = el("a", { href: u, download: name }); document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 4000); }
  function saveOne(m) {
    fetch(dl(m)).then(function (r) { if (!r.ok) throw 0; return r.blob(); }).then(function (b) {
      var f = new File([b], m.name || "photo", { type: b.type });
      if (navigator.canShare && /iP(hone|ad|od)/.test(navigator.userAgent) && navigator.canShare({ files: [f] })) return navigator.share({ files: [f] }).catch(function () {});
      saveBlob(b, m.name || "photo");
    }).catch(function () { toast("Couldn't download"); });
  }
  var CRC = (function () { var t = new Uint32Array(256); for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(u8) { var c = 0xFFFFFFFF; for (var i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function makeZip(files) {
    var enc = new TextEncoder(), parts = [], central = [], offset = 0, now = new Date();
    var dt = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1), dd = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    files.forEach(function (f) {
      var nb = enc.encode(f.name), d = f.data, crc = crc32(d);
      var lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(10, dt, true); lh.setUint16(12, dd, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, d.length, true); lh.setUint32(22, d.length, true); lh.setUint16(26, nb.length, true);
      parts.push(lh.buffer, nb, d);
      var ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(12, dt, true); ch.setUint16(14, dd, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, d.length, true); ch.setUint32(24, d.length, true); ch.setUint16(28, nb.length, true); ch.setUint32(42, offset, true);
      central.push(ch.buffer, nb); offset += 30 + nb.length + d.length;
    });
    var cs = 0; central.forEach(function (b) { cs += b.byteLength; });
    var e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cs, true); e.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [e.buffer]), { type: "application/zip" });
  }
  $("#dlAll").onclick = function () {
    var all = lightboxItems.filter(function (m) { return m.kind === "image"; }).concat(downloads);
    var skipped = lightboxItems.length - lightboxItems.filter(function (m) { return m.kind === "image"; }).length;
    var btn = this, used = {}; btn.disabled = true; toast("Preparing " + all.length + " files…");
    Promise.all(all.map(function (m) { return fetchBytes(dl(m)).then(function (d) {
      var n = (m.name || "file").replace(/[\/\\]/g, "-"), base = n, i = 2; while (used[n]) n = base.replace(/(\.[^.]+)?$/, " " + (i++) + "$1"); used[n] = 1; return { name: n, data: d };
    }); })).then(function (files) {
      saveBlob(makeZip(files), (document.title.split(" · ")[0] || "DailyDo").replace(/[\/\\:]/g, "-") + ".zip");
      toast(skipped ? "Downloaded. Videos are left out; save them one by one." : "Downloaded");
    }).catch(function () { toast("Couldn't download everything"); }).finally(function () { btn.disabled = false; });
  };
  $("#copyLink").onclick = function () {
    var u = location.href.split("#")[0];
    (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(function () { toast("Link copied"); }, function () { prompt("Copy this link", u); });
  };

  // ---- load ----
  window.addEventListener("hashchange", function () { location.reload(); });
  var m = location.pathname.match(/\/v\/([A-Za-z0-9_-]{6,80})/);
  var id = m ? m[1] : decodeURIComponent((location.hash || "").slice(1));
  if (!/^[A-Za-z0-9_-]{4,80}$/.test(id)) { showState("Nothing here", "This link is missing part of its address. Ask the sender to share it again."); return; }
  var src = /^demo-/.test(id) ? "/v-demo/" + id + ".json" : WORKER + "/set/" + encodeURIComponent(id);
  fetch(src, { cache: "no-store" }).then(function (r) {
    if (r.status === 404 || r.status === 410) throw "gone";
    if (!r.ok) throw "error";
    return r.json();
  }).then(function (set) {
    if (set.expiresAt && new Date(set.expiresAt) < new Date()) throw "gone";
    render(set);
    if (!/^demo-/.test(id)) fetch(WORKER + "/hit/" + encodeURIComponent(id), { method: "POST", keepalive: true }).catch(function () {});
  }).catch(function (e) {
    if (e === "gone") showState("This page is no longer available", "The sender stopped sharing it, or the link expired.");
    else showState("Couldn't load this page", "Check your connection and try again.");
  });
})();
